[package]
name = "service-com-amazonaws-servicecatalog-aws242servicecatalogservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
# A provisioning artifact NAMES its CloudFormation template (a URL, or the stack that
# contains it) rather than holding it, and the template is CloudFormation's to read: the
# client `DescribeProvisioningParameters` summarises that template through, over the
# in-process callback into this same emulator (no network client feature: the transport
# is the emulator's own).
aws-sdk-cloudformation = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque ListPortfolios page tokens: the resume key is hex-encoded, so a client
# cannot read a token as an id and a foreign token fails to decode.
hex = { workspace = true }
# A portfolio-principal association records the IDENTIFIER of the principal it names, and
# the account's principals are IAM's own records, read out of IAM's state in this same
# shared engine (no network client: the store is in-process).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The service that OWNS a CloudFormation template, and the object store a staged template
# lives in, mounted beside Service Catalog on the one engine the test router builds — the
# same shape `core/router/src/lib.rs` mounts them in: the parameters a product version
# declares are read through CloudFormation, which reads the staged object out of Amazon S3.
service-com-amazonaws-cloudformation-cloudformation = { workspace = true }
service-com-amazonaws-s3-amazons3 = { workspace = true }
# URL-form-encodes the CloudFormation request the suite that stages a SOURCE STACK sends
# (the encoder behind the `url` crate), so no suite hand-rolls a percent-encoder.
form_urlencoded = "1"

[lints]
workspace = true
