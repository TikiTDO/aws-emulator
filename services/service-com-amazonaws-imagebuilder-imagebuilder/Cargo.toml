[package]
name = "service-com-amazonaws-imagebuilder-imagebuilder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `service-common` carries this tree's ONE caller-supplied-ARN parse, which the
# component and image-recipe operations read a submitted ARN's Region, account and
# resource fields through instead of splitting the value again.
service-common = { path = "../common" }
# A component document is a YAML document ("Component data contains inline YAML document
# content for the component"), and the component TYPE and its parameter details are read
# out of it. yaml-rust2 is the pure-Rust YAML 1.2 implementation the other services that
# read caller-supplied YAML in this workspace use.
yaml-rust2 = { version = "0.10", default-features = false }
# The digest a `ListImageRecipes` page token carries over its own payload, so a token
# this emulator did not issue is refused instead of being read as a page position.
sha2 = { workspace = true }
# The same token's payload travels as hex, rather than through a hand-rolled encoding.
hex = { workspace = true }
# The Amazon S3 client `CreateComponent` fetches a `uri`-named component document through,
# over the in-process callback into this same emulator (no network client feature: the
# transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The AWS SDK for IAM, driven over the same in-process callback:
# `CreateInfrastructureConfiguration` resolves the `instanceProfileName` a configuration
# names against the account's own IAM before writing anything. Only the generated client is
# needed — the emulator supplies the transport.
aws-sdk-iam = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The percent-encoding an AWS SDK applies to a non-greedy `@httpLabel`, so the resource
# ARN the tagging operations take rides in the URI path the way a signed request puts it
# there, rather than through a hand-rolled escape in the tests.
percent-encoding = "2.3"
# The Amazon S3 service, mounted beside imagebuilder on one engine so a component document
# staged with `PutObject` is the one a `uri`-named create resolves.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# IAM, mounted beside imagebuilder on one engine so the instance profile a configuration
# names is one a `CreateInstanceProfile` really created — and a name nothing created
# resolves to nothing.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[lints]
workspace = true
