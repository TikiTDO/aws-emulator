[package]
name = "service-com-amazonaws-personalizeruntime-amazonpersonalizeruntime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `service-common` carries this tree's ONE caller-supplied-ARN parse, which the
# inference registry reads the resource type a `campaignArn` / `recommenderArn` /
# `filterArn` claims with (`src/state.rs`, `require_resource_kind`).
service-common = { path = "../common" }
# Deterministic, request-derived scoring and opaque recommendation ids
# (`src/state/scoring.rs`): SHA-256 as a stable mixing function, hex for the id.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
