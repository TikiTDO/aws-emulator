[package]
name = "service-com-amazonaws-notificationscontacts-notificationscontacts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `nextToken` ListEmailContacts hands out.
hex = { workspace = true }
# Computes the integrity tag that `nextToken` carries, so a token this service never
# issued is refused rather than resumed from.
sha2 = { workspace = true }
# The cross-service validation-message renderings this service's refusals delegate to:
# the per-member envelope with every clause's value half withheld, the unanchored
# `@pattern` expression, and the schema layer's property-count finding.
service-common = { path = "../common" }
# User Notifications holds the channel associations an email contact can be the
# channel of, so deleting a contact drops them from the store that owns them.
service-com-amazonaws-notifications-notifications = { path = "../service-com-amazonaws-notifications-notifications" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }

[lints]
workspace = true
