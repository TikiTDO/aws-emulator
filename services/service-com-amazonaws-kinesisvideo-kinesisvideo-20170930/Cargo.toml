[package]
name = "service-com-amazonaws-kinesisvideo-kinesisvideo-20170930"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `sync` and `time` beside the workspace features: one request on an announced data
# endpoint is read under an in-flight permit and the core's own request deadline
# (`src/state/data_plane_serving.rs`).
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
# Speaks HTTP/1.1 on the raw connection the core hands an announced data plane, which is
# what makes the announced origin one a stock client dials
# (`src/state/data_plane_serving.rs`). `hyper-util` carries the tokio IO and timer
# adapters for it, `http-body-util` the bounded body reader and the one-shot body.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde_json = { workspace = true }
tracing = { workspace = true }
# `service-common` carries the workspace's ONE AWS wording of a constraint-violation
# refusal, which `service.rs` states this service's error code over, and
# `data_plane_addressing::listener_authority`, the one reading of the `host:port` a URL
# addresses one of the emulator's own listeners by — which is what a published data
# endpoint carries (`src/state/data_endpoint.rs`).
service-common = { path = "../common" }
# The signaling channels' own DATA plane, which that service's crate owns: a channel this
# control plane creates has to exist in the registry `GetIceServerConfig` and
# `SendAlexaOfferToMaster` resolve a `ChannelARN` against, and the `WSS` endpoint this
# control plane announces is the socket that crate serves a channel's peers on. Only its
# `state` seams are used.
service-com-amazonaws-kinesisvideosignaling-awsacuitysignalingservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The data-endpoint tests dial the address `GetDataEndpoint` announces, in THIS process,
# as a client handed that address does: tokio's socket and byte-stream halves carry the
# HTTP exchange on the transport the announced scheme names. Both are the versions this
# workspace already builds.
tokio = { workspace = true, features = ["io-util", "net", "time"] }

[lints]
workspace = true
