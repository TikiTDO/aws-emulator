[package]
name = "service-com-amazonaws-verifiedpermissions-verifiedpermissions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# `DecodedClaims` in `src/state/token.rs`: a presented token's body is DESERIALIZED into
# the claim set this service reads one as, so a body that is not that claim set is
# reported by the deserializer — the claim at fault and its position in that body —
# rather than by prose of this service's own.
serde = { workspace = true }
tracing = { workspace = true }
# `json_document::minified`: the ONE minification of a JSON document a service takes
# as an opaque string member and reports back, which this service's stored Cedar
# schema document is. `jwt::read` / `jwt::verify`: the ONE reading of a compact JWS and
# the ONE check of its signature against the key set its issuer published, which
# `IsAuthorizedWithToken` takes its principal out of.
service-common = { path = "../common" }
# The Amazon Cognito user pools an identity source references live in that service's
# own state in this same shared engine, and a user pool PUBLISHES the key set its
# tokens are verified against (`<issuer>/.well-known/jwks.json`). An authorization call
# that takes its principal from such a token has to check the token's signature against
# that key set, so it is read from the service that owns it — this emulator fetches
# nothing from outside itself. Only the pool's PUBLIC key parameters are read.
service-com-amazonaws-cognitoidentityprovider-awscognitoidentityproviderservice = { workspace = true }
# Hex codec for the opaque ListPolicies pagination cursor.
hex = { workspace = true }
# The Cedar policy language itself: parses the Cedar policy text this service
# stores and evaluates authorization requests against it. Verified Permissions IS
# Cedar, so the real parser/authorizer is the only faithful implementation; a
# hand-written subset would answer every input it was not sized for wrongly.
#
# Capability classes this acquisition brings in, named deliberately:
#  * cedar-policy itself evaluates CALLER-SUPPLIED text. The language has no
#    network, filesystem, process or FFI primitive, and it has no loops,
#    recursion or calls, so an evaluation cannot escape the process and always
#    terminates. Size, count and depth are bounded in `src/state/cedar.rs`.
#  * BUILD-TIME CODE GENERATION: cedar-policy-core builds its grammar with
#    `lalrpop`, a parser generator that runs from a build script with the
#    builder's authority. It reads only the grammar files inside its own crate
#    and writes only into OUT_DIR, and the same class of build script already
#    runs in this workspace (every service crate has a `build.rs`).
#  * NATIVE CODE: cedar-policy-core depends on `stacker`, which grows the stack
#    so a deeply nested policy cannot overflow the request thread; `stacker`
#    compiles `psm` (hand-written assembly) through `cc`. That is unsafe code in
#    a dependency, which the workspace's `forbid(unsafe_code)` does not and
#    cannot cover — it binds authored code. It is accepted here because it is
#    precisely the mitigation for the stack-depth risk this dependency would
#    otherwise carry, and because it is confined to stack management.
# `cargo_audit` checks every locked version of all of the above.
cedar-policy = "4"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
