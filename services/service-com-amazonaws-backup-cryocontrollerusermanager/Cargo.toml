[package]
name = "service-com-amazonaws-backup-cryocontrollerusermanager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque, URL-safe encoding for the pagination cursors this service vends.
hex = { workspace = true }
# Parses the cron expression a backup rule schedules its jobs with, so a plan's
# upcoming runs are computed from that expression (and `chrono`, which it is
# built on, carries the date and time arithmetic).
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Resolves the IANA time zone a backup rule names, so its schedule is read in
# that zone rather than only in UTC.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): AWS Backup publishes a `Backup Job State Change`
# or `Copy Job State Change` event onto the account's default event bus as a job
# moves (`state::publish_job_state_changes`). Only the generated client is needed —
# the emulator supplies the transport, so the SDK's own HTTPS stack and runtime are
# left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The AWS SDK for DynamoDB, driven over the in-process callback
# (`OperationContext::callback`): a restore re-creates the protected resource in
# the service that owns it, so the restore of a DynamoDB table recovery point
# creates that table through DynamoDB's own API
# (`state::restore_execution::perform_restore`). Only the generated client is
# needed — the emulator supplies the transport.
aws-sdk-dynamodb = { version = "1", default-features = false }
# `eventbridge_client`: the tree's ONE construction of that in-process EventBridge
# client, so this service configures the publication hop exactly as every other
# publisher does. `iam_role`: the shared reading of a caller-supplied IAM role ARN
# and of what this account's IAM answers about it, for the role a backup
# selection's jobs would run as and for what a backup job's role is allowed to
# create; `iam_client` under it is the in-process hop that asks IAM, and
# `iam_authorization` is the tree's one wording of the denial that answers.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# EventBridge and SQS are mounted beside Backup on one engine in the integration
# tests, because a job transition publishes a state-change event onto the default
# event bus and a rule on that bus delivers it to an SQS queue target: without them
# mounted there is nothing for the publication to reach.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# The role-resolution suite mounts IAM beside this service on one engine and
# creates the roles it resolves through IAM's own wire, so the records read are
# the ones `CreateRole` wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# DynamoDB is mounted beside Backup in the restore suite: a restore re-creates
# the protected resource in the service that owns it, so the table a restore
# creates is read back through DynamoDB's own wire.
service-com-amazonaws-dynamodb-dynamodb-20120810 = { workspace = true }

[lints]
workspace = true
