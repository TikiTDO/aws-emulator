[package]
name = "service-com-amazonaws-deadline-deadline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The workspace's one home for the `date-time` timestamp wire form every restJson1
# service of this class shares (`service_common::date_time_json`).
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the 32-hex-character resource ids the farm/queue/job label patterns require.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` on top of the workspace features, for the one TEST that has to let the clock pass
# a job's CREATE_IN_PROGRESS -> CREATE_COMPLETE due instant without blocking the runtime.
# A dev-dependency, so the service's own build keeps the workspace feature set.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
