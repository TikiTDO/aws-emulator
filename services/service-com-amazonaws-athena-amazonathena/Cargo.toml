[package]
name = "service-com-amazonaws-athena-amazonathena"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# Athena's `AwsDataCatalog` IS the account's Glue Data Catalog, so the metadata
# operations read the databases and tables out of Glue's own store rather than keeping a
# second copy of them here.
service-com-amazonaws-glue-awsglue = { workspace = true }
# The object store two things here reach: the DATA a catalog table reads is the objects at
# its location, so a query over such a table reads them out of it; and a notebook imported
# from a `NotebookS3LocationUri` IS the object that location names, so the import reads it
# out of the one object store this emulator has rather than reporting success for content
# nothing holds.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# `page_tokens`: the authenticated continuation token every paginated read here hands
# back, so a `NextToken` this process did not mint names no page; `iam_authorization`: the
# ONE evaluation of IAM policy documents against a request, which is what decides whether
# the caller may act on the workgroup it named.
service-common = { path = "../common" }
# The identity-based policies in force on the calling principal, and the permissions
# boundary that caps them, read through IAM's own accessors: a workgroup is an IAM resource,
# so an Athena action on one is authorized against the documents that store holds.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# Which principal the request's access key id speaks for — the session STS minted it for,
# the same record `sts:GetCallerIdentity` answers from — so the identity a refusal blames is
# the one the caller reads back for the credentials it signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The SQL engine a query execution RUNS on, in-process.
#
# MEMORY-SAFETY POSTURE: the rationale, the bounds and the alternatives considered are
# recorded in this crate's README.md, section "The SQL engine, and its memory-safety
# posture". In short: this crate contains no `unsafe` and keeps the workspace's
# `unsafe_code = "forbid"` lint; the native component the `bundled` feature links is the
# SAME engine the workspace already links through `vendor/emulator-telemetry`
# (`rusqlite` 0.41, `bundled`), so no new native library enters the emulator process.
#
# CAPABILITY: this is an EXECUTION SUBSTRATE — it compiles caller-supplied SQL into
# instructions and runs them — and a NATIVE component: `bundled` makes libsqlite3-sys
# compile the SQLite C amalgamation at build time and link it in. Every host-filesystem
# escape it would otherwise re-open (`ATTACH DATABASE '<path>'`, `VACUUM INTO '<path>'`, a
# `PRAGMA` that re-enables a switch, extension loading, a virtual-table module) is closed
# in `Database::open` in src/state/query_engine.rs, before any request reaches the engine:
# default-deny authorizer, `SQLITE_LIMIT_ATTACHED = 0`, defensive mode, untrusted schema,
# no URI filenames, `temp_store = MEMORY`, `max_page_count`, `hard_heap_limit`, plus
# length, column, depth and compound-select limits. `limits` and `hooks` are the features
# those controls need; `load_extension` is deliberately absent.
#
# PINNED at 0.41, the release reviewed and built here: it is the first one whose
# `libsqlite3-sys` (0.39) carries a SQLite C library without RUSTSEC-2026-0459 (a
# page-cache disclosure through an undersized-page WAL file, fixed in SQLite 3.54.0),
# which 0.37's `libsqlite3-sys` 0.35 shipped. The two components 0.41 adds —
# `sqlite-wasm-rs` and its `rsqlite-vfs` — are gated to `wasm32` upstream and are not
# linked into a host build, so the engine in the process is still one bundled SQLite.
# The linked release is asserted against that floor by the engine-release suite of
# `services/service-com-amazonaws-rdsdata-rdsdataservice`.
rusqlite = { version = "0.41", features = ["bundled", "column_decltype", "hooks", "limits"] }
# `regex`: the pattern a `SHOW TABLES`/`SHOW VIEWS` statement narrows its answer by is
# matched by the linear-time matcher the Data Catalog's own listings use, not by a
# hand-rolled one.
regex = "1.13"
# `csv`: the objects under a table's location are DELIMITED TEXT, so the records and
# fields a read decodes out of them are read by the maintained reader for that format
# rather than by a splitter written here — the separator, the quoting and the line
# terminators come from the table's own SerDe.
csv = "1.4"
# `StatementType` is read off the PARSE of the submitted SQL rather than off its leading
# word, with the maintained parser this workspace already uses for caller-supplied SQL.
sqlparser = { version = "0.59", features = ["visitor"] }
# Mints the version-4 UUID a `QueryExecutionId` is.
uuid = { version = "1", features = ["v4"] }
# Renders the authenticated bytes of a page token, and a binary result value, as hex.
hex = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The query-lifecycle suite waits out the span a started query's completion is due
# after, so it needs the timer driver as well as the runtime.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
