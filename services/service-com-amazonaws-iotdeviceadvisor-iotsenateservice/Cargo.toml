[package]
name = "service-com-amazonaws-iotdeviceadvisor-iotsenateservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Used in `src/state.rs`: an endpoint's DNS label is a SHA-256 digest of the account, the
# region and the device identity, mapped onto the label alphabet.
sha2 = { workspace = true }
# `service-common` carries the ONE reading of how a client ADDRESSES a data plane, which
# the endpoint this service announces is resolved through
# (`src/state/endpoint_addressing.rs`).
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# The suites that read the audit capture back share one process-wide buffer, so they
# serialize on an async-aware lock held across awaits (`tests/all/audit_trail.rs`).
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
