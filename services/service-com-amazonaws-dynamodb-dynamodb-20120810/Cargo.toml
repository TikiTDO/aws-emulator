[package]
name = "service-com-amazonaws-dynamodb-dynamodb-20120810"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` beyond the workspace features: `DescribeTable` waits out the remainder of a
# table's clock-owed creation before it answers a poll (`ops::describe_table`).
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Linear-time substring search over BYTES: `contains(path, :operand)` over a binary
# attribute searches one caller-sized value for another, so the search has to cost the
# SUM of the two lengths rather than their product (`state::expressions::contains_bytes`).
memchr = "2"
# Exact decimal arithmetic for the `N` attribute type: an `ADD`ed or `SET`-computed
# number carries up to 38 significant digits, which no primitive float can hold.
bigdecimal = "0.4"
# Mints the UUID-format `TableId` DynamoDB generates for every table it creates
# (`state::new_table_id`).
uuid = { version = "1", features = ["v4"] }
# The policy revision id is a digest of the policy document, so the same document
# always gets the same id (PutResourcePolicy's documented idempotency).
sha2 = { workspace = true }
# Hex rendering for that digest.
hex = { workspace = true }
# The DynamoDB Streams service owns the stream registry a table publishes into:
# enabling a stream on CreateTable/UpdateTable registers it through that crate's
# `state::register_stream` seam, which is what its own consumers then read.
service-com-amazonaws-dynamodbstreams-dynamodbstreams-20120810 = { workspace = true }
# The Kinesis service owns the data streams a table's streaming destination replicates
# to: enabling one resolves its `StreamArn` against that crate's own stream registry
# (`state::kinesis_stream_exists`), so a destination pointed at a stream that does not
# exist settles ENABLE_FAILED instead of ACTIVE.
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }
# `ExportTableToPointInTime` writes the exported items into the destination bucket through
# Amazon S3's OWN store on the same engine, so a caller lists and reads those objects
# where S3 holds them (`state::export_objects`).
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The data file an export writes is GZIP-compressed (`.json.gz`), which is the encoder for
# it; the pure-Rust backend, so nothing links a system library. The same decoder reads a
# GZIP-compressed import source (`state::import_objects`).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# An import source may be CSV (`ImportTable$InputFormat`), whose quoting and escaping this
# reads rather than splitting on the delimiter by hand (`state::import_objects`).
csv = "1"
# An import source may be Zstandard-compressed (`ImportTable$InputCompressionType`); the
# pure-Rust decoder, so nothing links a system library (`state::import_objects`).
ruzstd = "0.9"
# The KMS service owns the keys a table's `SSESpecification` names: resolving the key id,
# ARN, alias name or alias ARN a request carries into the key ARN `SSEDescription` reports
# is that service's answer, read through its `state` seam (`state::encryption`).
service-com-amazonaws-kms-trentservice = { workspace = true }
# CloudWatch owns the Contributor Insights rules this feature IS: enabling contributor
# insights on a table or index mints them in that service's own insight-rule store, where
# `DescribeInsightRules` lists them and `GetInsightRuleReport` reports the ranked keys
# (`state::contributor_insights`). It also owns the metric store a table's own throughput
# observations are published into: every request this service serves counts the capacity it
# consumed into that store (`state::consumed_capacity_metrics`), which is where a client reads
# `AWS/DynamoDB` `ConsumedReadCapacityUnits`/`ConsumedWriteCapacityUnits` back and what an
# alarm on those metrics is evaluated against.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# `query_error_envelope`: the tree's one statement of how a response names the request it
# answers (`x-amzn-RequestId`), wired into this service's operation dispatch and its
# framework-level error renderers (`service::EmulatedService`).
# `iam_authorization`: the tree's one evaluation of IAM policy documents, which the
# data-plane authorization gate judges the caller's identity-based policies by
# (`state::authorization`).
service-common = { path = "../common" }
# `state::authorization` resolves WHO a data-plane request speaks for from the same place
# `sts:GetCallerIdentity` answers from, and reads the identity-based policies the IAM store
# holds for that principal through STS's own view of it.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The objects an export writes are asserted where Amazon S3 holds them, through that
# service's OWN client over the emulator's in-process callback (`tests/all/table_exports`).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[lints]
workspace = true
