[package]
name = "service-com-amazonaws-neptunegraph-amazonneptunegraph"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `nextToken` this service's listings page with.
hex = { workspace = true }
# `request_access_key_id`: the one reading of a request's SigV4 access key id, which the
# pass-role denial resolves the caller's principal from.
service-common = { path = "../common" }
# The STS store resolves which principal an access key id speaks for, and reads the IAM
# store for a long-term key's owner: a pass-role denial names the principal
# `sts:GetCallerIdentity` reports for the same credentials, so this service reads STS's
# OWN resolution rather than keeping a second answer to that question.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The data plane decides whether the caller's own IAM policies allow a query, so it reads
# the documents in force on the calling principal through the IAM service's OWN
# accessors (`src/state/query_authorization.rs`): a policy `iam:PutUserPolicy` wrote
# takes effect on the next query.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# An accepted import task reads the data its `source` names out of this emulator's own
# Amazon S3 (`src/state/import_load.rs`), over the in-process callback into this same
# emulator: no network client feature is enabled, because the transport is the
# emulator's own.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Reads the two delimited bulk-load formats (the Gremlin CSV and openCypher load
# formats) an import task's objects are written in.
csv = "1.3"
# Reads the columnar (PARQUET) bulk-load format. No compression codec beyond the
# format's own default is enabled.
parquet = { version = "60", default-features = false, features = ["snap"] }
# Parses the RDF N-Triples bulk-load format, and reads the terms (IRIs, blank nodes
# and typed literals) a triple carries.
oxttl = "0.2"
oxrdf = "0.3"
# `cypher-parser`: the openCypher query `ExecuteQuery` takes is LEXED, PARSED and
# EXECUTED with it against this service's stored graph, so a malformed query is refused
# by a real Cypher parser and a well-formed one is answered by a real evaluator. Taken
# with NO features: the crate declares none and depends on nothing (its Cargo.lock entry
# carries no dependency list), so what it can do is its own documented surface — a
# read-only Cypher subset (MATCH / OPTIONAL MATCH / UNWIND / WITH / WHERE / RETURN, the
# scalar functions and aggregates its docs list) with "write clauses (CREATE, MERGE,
# SET, DELETE, …) intentionally not supported", no file-loading or procedure clause, no
# extension or dynamic-import mechanism and no FFI, reading the graph only through the
# `GraphProvider` trait this crate implements (`src/state/open_cypher.rs`). Every bound
# on what one query may read, nest, be handed and answer with is stated on this side of
# it, and `tests/all/execute_query_data_plane.rs` pins that surface over the wire.
cypher-parser = { version = "0.8", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The import-run suite mounts Amazon S3 beside this service on ONE engine, exactly as
# the assembled router mounts them, and stages the objects a load reads through that
# service's OWN `PutObject` — so what an import reads is what Amazon S3 really holds.
# DEV-ONLY outside the tests below.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The pass-role denial test asks `sts:GetCallerIdentity` itself what principal a
# credential speaks for, so STS is mounted beside this service, and the IAM store holds
# the users whose long-term keys the rows present (the IAM crate itself is a regular
# dependency: the data plane reads its policies).

[lints]
workspace = true
