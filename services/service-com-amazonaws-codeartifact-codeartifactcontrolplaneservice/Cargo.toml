[package]
name = "service-com-amazonaws-codeartifact-codeartifactcontrolplaneservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
# `raw_value`: a published npm manifest is kept as the TEXT it arrived as, so nothing
# re-orders what the publisher declared (a dependency list is reported in declared order).
serde_json = { workspace = true, features = ["raw_value"] }
tracing = { workspace = true }
# Stable, content-derived suffixes for the asset-bucket and KMS-key ARNs a domain
# reports (SHA-256 of the domain's account/region/name), so the same domain reports the
# same ARNs on every read. Also the SHA-256 and SHA-512 of a published asset.
sha2 = { workspace = true }
# Hex encoding for those ARN suffixes, for the opaque `nextToken` cursors and for the
# hex digests an asset's `hashes` map and `assetSHA256` are spelled in.
hex = { workspace = true }
# `arn`: the one parse of a caller-supplied `resourceArn`, so this service agrees with
# every other on which ARNs name its own resources and what an ARN's fields are.
# `data_plane_addressing`: the one reading of how a client addresses a data plane, which
# the repository endpoints this service publishes are. `iam_authorization`: the shared
# evaluation of policy documents against an action on a resource, so every service that
# enforces authorization decides alike.
service-common = { path = "../common" }
# The STS store, for the session an access key id speaks for: the principal a token mint
# is authorized as, and the temporary-credential expiry `durationSeconds=0` ties a token to.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The KMS store, for the key a domain is encrypted with: the key a `CreateDomain`
# `encryptionKey` reference resolves to, and the Amazon Web Services managed key of the
# account and Region a create that names none is given.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The remaining two algorithms of the model's `HashAlgorithm` enum, which an
# `AssetSummary.hashes` map reports beside SHA-256 and SHA-512.
md-5 = "0.10"
sha1 = "0.10"
# The opaque `versionRevision` of a package version: base64 of its content digest.
base64 = "0.22"
# Percent-encoding of the identifiers this service puts in an ARN resource path (a
# package group's pattern carries wildcards and sigils), and the decoding of a
# caller-supplied `resourceArn` back into them. Also the `resourceArn` query value the
# tagging suite sends, as it is for the sibling service crates.
percent-encoding = "2.3"
# The STREAMING read of an npm metadata document, so a dependency list is reported in the
# order the document declares it whatever map type `serde_json` was built with.
serde = { workspace = true }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): CodeArtifact announces every package version state
# change on the account's default event bus
# (`state::package_version_events`). Only the generated client is needed — the emulator
# supplies the transport, so the SDK's own HTTPS stack and runtime are left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The twine/pip UPLOAD a repository's pypi endpoint accepts is a `multipart/form-data`
# document (`:action=file_upload` plus the distribution file), read by `multer` over the
# buffered body `futures-util` hands it as a one-chunk stream.
multer = "3.1"
futures-util = { version = "0.3", default-features = false }
# An npm version's tarball is a gzip-framed tar, opened to recover the `README` a publish
# document does not declare inline: `flate2` unframes it and `tar` walks its entries.
flate2 = "1"
tar = "0.4"

[dev-dependencies]
# EventBridge and SQS are mounted beside CodeArtifact on one engine in the integration
# tests, because a package version state change is published onto the default event bus and
# a rule on that bus delivers it to an SQS queue: without them mounted there is nothing for
# the publication to reach.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
