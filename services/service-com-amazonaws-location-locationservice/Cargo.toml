[package]
name = "service-com-amazonaws-location-locationservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries the workspace's ONE caller-supplied-ARN parse, which the tag
# operations read their `ResourceArn` against — the vendor field before any lookup, then
# the resource type and id the ARN addresses — rather than splitting the value here.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Polygon geometry checks for geofence writes: ring self-intersection, interior-ring
# containment and ring crossing (the `geo` crate's OGC validity), plus winding order.
geo = { version = "0.33", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# RFC 3986 percent-encoding, so a test can put an ARN in a single-segment
# `@httpLabel` and tag keys in `@httpQuery` values the way an SDK does.
percent-encoding = "2.3"

[lints]
workspace = true
