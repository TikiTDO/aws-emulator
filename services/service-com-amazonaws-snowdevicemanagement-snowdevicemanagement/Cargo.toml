[package]
name = "service-com-amazonaws-snowdevicemanagement-snowdevicemanagement"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes a pagination cursor into the `[a-zA-Z0-9+/=]` alphabet `NextToken` models.
hex = { workspace = true }
# Fingerprints the enumeration a pagination cursor is a position in, at a fixed size.
sha2 = { workspace = true }
# The Snow Family ORDER store this service's device inventory is a projection of. This API
# models no device-creation operation because a device becomes remotely manageable by being
# ORDERED — a Snowball job created with remote management installed — so the crate that
# holds those orders is the component the inventory is read from (src/state/snow_orders.rs).
service-com-amazonaws-snowball-awsiesnowballjobmanagementservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
