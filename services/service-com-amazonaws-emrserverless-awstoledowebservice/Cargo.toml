[package]
name = "service-com-amazonaws-emrserverless-awstoledowebservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The cross-service rules this service takes: the framing of a 204 answer that carries no
# content, and the status such an answer carries.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque `ListApplications` / `ListJobRuns` pagination cursors.
hex = { workspace = true }
# Digests the rendered `CreateApplication` request behind the idempotency-token
# fingerprint, and the grant behind a `GetDashboardForJobRun` URL's token.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
