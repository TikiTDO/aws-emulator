[package]
name = "service-com-amazonaws-lakeformation-awslakeformation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Wraps the opaque `ListLFTags` continuation token so a caller round-trips it as bytes.
hex = { workspace = true }
# The Glue Data Catalog's own store: `GrantPermissions` grants permissions ON databases
# and tables, which Glue owns, so their existence is read from Glue's state in the shared
# engine rather than kept a second time here.
service-com-amazonaws-glue-awsglue = { workspace = true }
# `iam_principal`: the tree's one resolution of a caller-supplied IAM principal against
# this account's IAM, which `GrantPermissions` resolves its grantee through.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
