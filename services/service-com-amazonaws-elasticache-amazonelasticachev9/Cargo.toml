[package]
name = "service-com-amazonaws-elasticache-amazonelasticachev9"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex is the codec the opaque pagination `Marker` is built with, and the one the
# reserved-cache-node offering ids are rendered in (src/state.rs).
hex = { workspace = true }
# SHA-256 derives each reserved-cache-node offering's id from its attributes, so
# the published catalog needs no counter and reports the same id on every read
# (src/state.rs), and mints the per-response correlation id the awsQuery error
# envelope carries (src/service/query_error_envelope.rs).
sha2 = { workspace = true }
# The KMS client a `KmsKeyId` is resolved to its key's ARN through, over the
# in-process callback into this same emulator (src/state/kms_key.rs); no network
# client feature is enabled, because the transport is the emulator's own.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The AWS SDK for EC2, driven over the same in-process callback: the subnets a
# cache subnet group or a serverless cache is placed in are EC2's resources, so
# `src/state/ec2_subnets.rs` asks EC2 what the account has rather than deciding
# it here. Only the generated client is needed — the emulator supplies the
# transport — and `behavior-version-latest` is what `BehaviorVersion::latest()`
# in that module is gated behind.
aws-sdk-ec2 = { version = "1", default-features = false, features = ["behavior-version-latest"] }
# The AWS SDK for Amazon S3, driven over the same in-process callback: exporting a
# serverless cache snapshot writes its data set into a bucket, and buckets and objects
# belong to Amazon S3, so `src/state/s3_export.rs` writes it where that service holds
# it. Only the generated client is needed — the emulator supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `arn::region_label`: the ONE reading of a caller-supplied Region as a Region
# LABEL, which is what the endpoint the EC2 call above is made at is built from.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The encryption suite mounts KMS beside ElastiCache on one engine, because
# resolving the key a resource names is a call into it.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The EC2 service, mounted beside this one in the test harness: that a cache
# subnet group can be created in the subnets the account HAS can only be driven
# end to end with the owner of subnets on the same engine. DEV-ONLY: this crate
# depends on no other service's crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# Amazon S3, mounted beside this one in the test harness: the object an export of a
# serverless cache snapshot writes is read back through that service's OWN operations,
# so what the export reports is what the owner of objects really holds.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
