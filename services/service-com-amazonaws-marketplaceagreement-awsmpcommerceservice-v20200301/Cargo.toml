[package]
name = "service-com-amazonaws-marketplaceagreement-awsmpcommerceservice-v20200301"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share,
# and the ONE evaluation of IAM policy documents the authorization layer decides on.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal,
# which is what the authorization layer in front of this service's handlers decides on.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The Marketplace Entitlement Service store, which OWNS the product entitlement a
# seller reads for an accepted agreement: accepting an agreement publishes its grants
# there (`crate::state::granted_entitlements`).
service-com-amazonaws-marketplaceentitlementservice-awsmpentitlementservice = { workspace = true }
# The License Manager store, which OWNS the licence `AgreementEntitlement$licenseArn`
# names: the same publication creates it, so that ARN resolves to a licence.
service-com-amazonaws-licensemanager-awslicensemanager = { workspace = true }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Pagination tokens: a digest of the query a page belongs to, hex-encoded, so a
# `nextToken` is opaque and cannot resume a different query.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
