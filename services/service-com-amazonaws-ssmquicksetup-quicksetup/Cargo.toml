[package]
name = "service-com-amazonaws-ssmquicksetup-quicksetup"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# `validation_message`: the workspace's ONE rendering of a modelled-constraint refusal as
# AWS words it on a JSON protocol — the `@pattern` requirement quoted without the
# whole-value anchor pair — which `service.rs` answers `override_refusal` on.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The maintained regular-expression engine, so the form an `IAMRoleArn` member's
# `@arnReference` names — which the model states as a reference rather than as a
# `@pattern`, so the boundary validator cannot apply it — is matched by the same engine
# the boundary validator runs a modelled `@pattern` through, rather than by a hand-rolled
# restatement of the expression the refusal advertises.
regex = "1.13"
# Encodes/decodes the opaque `NextToken` the list operations hand out.
hex = { workspace = true }
# The IAM store a definition's `LocalDeploymentAdministrationRoleArn` is resolved against,
# to decide whether the service that deploys a LOCAL configuration may assume that role
# (`state::local_administration_role`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
