[package]
name = "service-com-amazonaws-cleanroomsml-awsstarkcontrolservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Clean Rooms owns collaborations and memberships; a Clean Rooms ML resource is
# created under a membership, so this crate reads that membership from the store
# the owning service keeps.
service-com-amazonaws-cleanrooms-awsbastioncontrolplaneservicelambda = { workspace = true }
# `service-common` carries the workspace's ONE restJson1 codec that renders a timestamp
# member in the `date-time` form a model declares; every timestamp member of this model
# declares it, so this service answers through that codec.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
