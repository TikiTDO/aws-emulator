[package]
name = "service-com-amazonaws-glue-awsglue"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The content digest a resource policy's `PolicyHash` is derived from, hex-rendered.
sha2 = { workspace = true }
hex = { workspace = true }
# The `Expression` filter of `GetTables` is a regular expression, matched here by the
# regex crate rather than by a hand-rolled matcher.
regex = "1.13"
# The shared IAM policy evaluator and IAM-ARN reading, for the crawler-role checks.
service-common = { path = "../common" }
# The account's own IAM records, read through the same shared engine, so a crawler's
# `Role` is resolved against the roles `CreateRole`/`PutRolePolicy` wrote, and the role
# behind an assumed-role session is the one the account holds.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# WHO a signed request speaks for: STS's own resolution of the access key id, the same
# record `sts:GetCallerIdentity` answers from, so the principal a Lake Formation decision
# is made about is the one the caller reads back for the credentials it signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The account's own IAM Identity Center instances, read through the same shared engine, so
# the `InstanceArn` of a Glue Identity Center configuration is resolved against the
# instances `CreateInstance`/`ListInstances` answer for.
service-com-amazonaws-ssoadmin-swbexternalservice = { workspace = true }
# The KMS client the catalog resolves `EncryptionAtRest$SseAwsKmsKeyId` through, and
# encrypts and decrypts a catalog object's data key with, over the in-process callback
# into this same emulator (no network client feature is enabled: the transport is the
# emulator's own).
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The Amazon S3 client a column statistics task run reads the objects behind a table's
# `StorageDescriptor.Location` through, over the in-process callback into this same
# emulator (no network client feature is enabled: the transport is the emulator's own, so
# no socket is opened and no host is resolved).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The Lake Formation client the Data Catalog's read paths consult the permissions held on
# a database through, over the in-process callback into this same emulator: Lake Formation
# owns those grants, so they are read from it rather than kept a second time here (no
# network client feature is enabled: the transport is the emulator's own).
aws-sdk-lakeformation = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The glob patterns a crawler's `S3Target$Exclusions` are written in, matched against each
# object's path relative to the target — `**`, `{a,b}` and character classes included — by
# the globset crate rather than by a hand-rolled matcher.
globset = "0.4"
# Reads the delimited text behind a Data Catalog table when a column statistics task run
# aggregates its columns; a library computing over data in this process, with no native or
# build-time code.
csv = "1.3"
# Decodes the base64 a text-format table writes a binary column's value as, so the lengths
# a run reports for that column are the value's rather than the encoding's.
base64 = "0.22"
# Parses an Avro schema document and decides, by Avro's own schema-resolution rules,
# whether a reader schema can read data written with a writer schema — the question the
# schema registry's compatibility modes ask of two versions of a schema set. Only the
# schema algebra is used; no codec feature is enabled.
apache-avro = { version = "0.17", default-features = false }
# The CONTAINED Python interpreter a Glue job run's own script is executed by, and the AWS
# SDK modules that interpreter puts on a script's import path — both reached through the
# Lambda service crate, which is where this workspace's ONE embedded Python execution
# substrate lives (`state::execution::python`). Reused rather than stood up a second time
# here, so a job script runs under exactly the containment and the bounds that engine
# already enforces, and this crate adds no execution surface of its own: it supplies the
# script's source, its command line and its ceilings
# (`crate::state::job_script`) and nothing else.
#
# Capability class: an execution substrate. What it re-opens is answered by that engine and
# by this crate's own module docs — the interpreter is built with the engine crate's
# host-reaching features compiled out, its native modules are an allow-list that leaves
# every socket, subprocess, memory-map and host-library module unregistered, the
# operating-system modules a script can import are the workspace's own in-memory ones, and
# every bound (wall clock, steps, memory, recursion, output size) lives in host code no
# script can reach. It brings no build-time code of its own beyond the generated service
# scaffolding every service crate here builds.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The catalog-encryption suite mounts the KMS service beside Glue on one engine, because a
# catalog write and a catalog read of an SSE-KMS catalog each call it.
service-com-amazonaws-kms-trentservice = { workspace = true }
# Amazon S3, mounted beside Glue on one engine, so a column statistics task run aggregates
# the objects a test staged with `PutObject` at the covered table's location.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# Lake Formation, mounted beside Glue on one engine, because the catalog's read paths ask
# it which permissions the caller holds. It depends on this crate (a grant names a Data
# Catalog resource), so it is a dev-dependency here and never a dependency.
service-com-amazonaws-lakeformation-awslakeformation = { workspace = true }

[lints]
workspace = true
