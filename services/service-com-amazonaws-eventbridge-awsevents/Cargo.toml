[package]
name = "service-com-amazonaws-eventbridge-awsevents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time`: an api-destination delivery bounds each attempt at the endpoint by the
# client execution timeout AWS documents for one (`ops::put_events`), and the
# schedule clock waits between its passes with it rather than parking a worker
# thread; `rt` is the handle it spawns that one task onto (`state::schedule`).
tokio = { workspace = true, features = ["rt", "time"] }
bytes = { workspace = true }
http = { workspace = true }
# `unbounded_depth`: the parser's own depth default is replaced by this service's
# published `Detail` nesting bound (`state::MAX_DETAIL_DEPTH`), which the parse
# enforces up front instead.
# `raw_value`: reading a document as a raw value is how its well-formedness is
# checked without descending into it, so a document at the published nesting
# bound is read without the stack a recursive read of it would need.
serde_json = { workspace = true, features = ["unbounded_depth", "raw_value"] }
tracing = { workspace = true }
# `base64`: a BASIC connection's `Authorization` header is the base64 of
# `<user>:<password>` (RFC 7617), encoded by this crate rather than by hand
# (`state::invocation`).
base64 = "0.22"
# `percent-encoding`: the query-string parameters an api-destination invocation
# carries are percent-encoded with the crate's own query set, so a value holding
# a space or an `&` travels as one value (`state::invocation`).
percent-encoding = "2"
# `form_urlencoded`: an OAUTH_CLIENT_CREDENTIALS connection's token request
# carries its client credentials as an `application/x-www-form-urlencoded` body
# (RFC 6749), encoded by this crate rather than by hand (`state::oauth`).
form_urlencoded = "1"
# Opaque list page tokens are hex-encoded so they are URL- and header-safe.
hex = { workspace = true }
# `arn`: the ONE parse of a caller-supplied resource ARN, shared with every other
# service \u2014 a rule's target ARN is read through it rather than split here.
# `json_reference_path`: the ONE bounded evaluation of a caller-supplied JSON path that
# names a single value, which a Kinesis target's `PartitionKeyPath` is read through.
service-common = { path = "../common" }
# The AWS SDK for SQS, driven over the in-process callback
# (`OperationContext::callback`): a rule delivers a matched event to its SQS queue
# targets with `SendMessage` (`ops::put_events::deliver`). Only the generated
# client is needed — the emulator supplies the transport, so the SDK's own HTTPS
# stack and runtime are left out.
aws-sdk-sqs = { version = "1", default-features = false }
# The clients for the other target kinds a rule's matched event is delivered to,
# over the same in-process callback: a Lambda function (`Invoke`), an SNS topic
# (`Publish`) and a Step Functions state machine (`StartExecution`).
aws-sdk-lambda = { version = "1", default-features = false }
aws-sdk-sns = { version = "1", default-features = false }
aws-sdk-sfn = { version = "1", default-features = false }
# A Kinesis data stream target is delivered to with `PutRecord`, over the same
# in-process callback.
aws-sdk-kinesis = { version = "1", default-features = false }
# A CodePipeline pipeline target is delivered to with `StartPipelineExecution`,
# over the same in-process callback.
aws-sdk-codepipeline = { version = "1", default-features = false }
# A CloudWatch Logs log-group target is delivered to by WRITING into the group
# over the same in-process callback (`CreateLogStream` then `PutLogEvents`), and
# the resource policies in force over that group — which decide the write — are
# read through `DescribeResourcePolicies`.
aws-sdk-cloudwatchlogs = { version = "1", default-features = false }
# An Amazon Data Firehose delivery-stream target is delivered to with `PutRecord`
# over the same in-process callback: the stream then buffers the record and
# delivers it to its own destination.
aws-sdk-firehose = { version = "1", default-features = false }
# `FailedInvocations`, the metric EventBridge counts an undeliverable event on,
# is appended to the CloudWatch store in the SAME shared engine (the `AWS/Events`
# namespace). CloudWatch refuses a `PutMetricData` into a reserved `AWS/`
# namespace, so a service's own metrics never travel over that API; this writes
# the very store `ListMetrics`/`GetMetricStatistics` read.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The IAM store a target's `RoleArn` is resolved against, to decide whether
# EventBridge may assume that role and make the target's API call under it — and
# the identity the access key id a client's `PutEvents` presents speaks for,
# together with that identity's own policies (`state::authorization`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The KMS store holds the state of the customer managed key an event bus is
# encrypted with: a publication onto such a bus has to be encrypted under that
# key, so `PutEvents` resolves the bus's `KmsKeyIdentifier` in the KMS service's
# OWN store (the one `DisableKey`/`EnableKey` write) rather than keeping a second
# copy of a key's state.
service-com-amazonaws-kms-trentservice = { workspace = true }
# A rule target that is a Glue WORKFLOW is delivered to by counting the event
# against that workflow's EVENT trigger in the Glue store of this same shared
# engine (`ops::put_events`). Glue serves no API for that ingress — the action a
# target's role carries, `glue:notifyEvent`, belongs to no operation of the Glue
# model — so the delivery writes the very store `GetWorkflowRuns` reads, exactly
# as this service's own metrics are written into CloudWatch's.
service-com-amazonaws-glue-awsglue = { workspace = true }
# `uuid`: a state-machine target's execution is named `<event id>_<uuid>`, whose
# suffix is a fresh v4 UUID per invocation (`ops::put_events`).
uuid = { version = "1", features = ["v4"] }
# The `cron(...)` half of a rule's `ScheduleExpression` is read by this maintained
# parser rather than by a hand-written one, and `chrono` (which it is written in)
# is what the instants it names are read as (`state::schedule`).
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The `Authorization: Basic` header the invocation test computes the way
# RFC 7617 defines it, rather than asserting one encoded literal.
base64 = "0.22"
# `tokio::time` drives the tests' wait past a connection transition's due instant.
tokio = { workspace = true, features = ["time"] }
# The services a rule's targets live in are mounted beside EventBridge on one
# engine in the delivery tests, because a delivery is asserted where a client sees
# it: on the queue, on the topic, on the state machine's executions — and the role
# a target names, plus the metric a failed delivery counts, live in IAM and
# CloudWatch.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
service-com-amazonaws-sfn-awsstepfunctions = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }
service-com-amazonaws-kms-trentservice = { workspace = true }
# A rule target that is a CloudWatch Logs log group is asserted where a client
# reads one: the log events that service's own `FilterLogEvents` reports, and the
# resource policy on the group that decides whether the write happens at all.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# A publication a RUNNING Lambda handler makes is judged against the policies in
# force on the function's execution role, so the authorization suite that spans
# that path mounts Lambda and the token service beside EventBridge on one engine:
# Lambda runs the handler, the token service mints the role session its SDK call is
# signed as, and this service decides the publication.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The deployment package that suite uploads is a .zip archive it writes in memory.
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
