[package]
name = "service-com-amazonaws-appfabric-fabricfrontendservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Diffuses the entropy every AppFabric resource id (a version-4 UUID) is built
# from — see `crate::state::new_uuid`.
sha2 = { workspace = true }
# Renders a digest as hex, rather than this crate hand-coding the encoding — see
# `crate::state::render_credential`.
hex = { workspace = true }
# Two shared readers: `addresses_modeled_http_route` — the one reader that answers
# which operation a request ADDRESSES (the method and URI pattern of that
# operation's own `@http` binding) for a request the REST router's route lookup
# withheld a route from (see `crate::service::request_validation`) — and `arn`, the
# one parse of a caller-supplied resource ARN's fields, which says whether an ARN is
# in this service's namespace at all (see `crate::state::arn_resource_type`).
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
