[package]
name = "service-com-amazonaws-transfer-transferservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Codec for the opaque `NextToken` the List* operations hand out (see `src/state.rs`).
hex = { workspace = true }
# OpenSSH key formats: generates a server's host key and computes the Base64 SHA256
# fingerprint `DescribedServer.HostKeyFingerprint` reports (see `src/state.rs`).
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "getrandom"] }
# Decodes the base64 key payload of an `SshPublicKeyBody`, which is what says whether
# the body carries key material at all (see `src/state/ssh_public_key_body.rs`).
base64 = "0.22"
# `arn::parse`: the ONE shared ARN parse, which the authorization gate reads a role
# ARN's account and resource fields through; `iam_authorization`: the ONE shared
# evaluation of IAM policy documents, which makes that gate's decision.
service-common = { path = "../common" }
# The account's IAM store: the authorization gate reads the calling principal's
# identity policies, and an API_GATEWAY invocation role's, out of it
# (see `src/state/authorization.rs`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The account's IAM Identity Center instances: a web app's Identity Center application
# can only be registered in an instance the account holds, which that service's own
# store is the authority on (see `src/state/identity_center.rs`).
service-com-amazonaws-ssoadmin-swbexternalservice = { workspace = true }
# Reads the PEM framing and the DER of the X.509 certificate `ImportCertificate`
# carries, so the serial and validity period a certificate reader reports are the
# certificate's own (see `src/state.rs`).
x509-cert = { version = "0.2", features = ["pem"] }
# The SFTP user's credentials an SFTP connector's `UserSecretId` names: read over the
# in-process callback when a connection on that connector is tested or run
# (see `src/state/sftp_target.rs`).
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The storage an accepted connector transfer reads from and writes to
# (see `src/state/connector_delivery.rs`).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The Lambda function a workflow's CUSTOM step names as its `Target`, invoked with that
# step's callback token (see `src/state/connector_delivery.rs`).
aws-sdk-lambda = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Generates the OpenSSH host key the HostKey round-trip test supplies, and computes the
# fingerprint it expects back, independently of the handler under test.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "getrandom"] }
# `time` for the clock-due start-transition test's `tokio::time::sleep`.
tokio = { workspace = true, features = ["time"] }
# Generates the real certificates and key pairs the certificate suite imports, so the
# serial and validity window it expects back come from the certificate rather than from
# the code under test. TEST-ONLY.
rcgen = "0.13"
# The two services the connector data plane reaches over the in-process callback: the
# suite mounts them on the same router, so the secret a connector's session
# authenticates with and the storage its transfer moves bytes through are the real
# emulated ones. TEST-ONLY.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
