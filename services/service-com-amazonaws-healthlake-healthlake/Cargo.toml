[package]
name = "service-com-amazonaws-healthlake-healthlake"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The `vnd.amazon.eventstream` framing and the routing seam the hand-authored
# `UpdateProfileWithAgent` needs: its output is a `@streaming` event-stream union,
# which the generated operation shim cannot serialize.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints opaque 32-character `DatastoreId` values (SHA-256 of the mint counter
# and the creation instant, hex-encoded) instead of leaking either verbatim.
sha2 = { workspace = true }
hex = { workspace = true }
# Parses the C-CDA (XML) documents `POST /validate-source` validates; the report is
# computed by walking a real parse tree rather than by matching on the source text.
roxmltree = "0.20"
# Amazon S3 client a `StartFHIRImportJob` run reads the FHIR data its
# `InputDataConfig` names with (`src/state/import_run.rs`), over the in-process
# callback into this same emulator: no network client feature is enabled, because
# the transport is the emulator's own.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Parses the sample data (CSV) file a `CreateDataTransformationProfile` infers a
# profile mapping from (`src/state/sample_data.rs`): the columns and the values the
# mapping is inferred from come from a real CSV reader, not from matching on text.
csv = "1.4"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The integration tests wait out a stored lifecycle due instant; no handler sleeps,
# so the `time` feature is enabled here rather than on the shipped crate.
tokio = { workspace = true, features = ["time"] }
# The import suite mounts Amazon S3 beside this service on ONE engine, exactly as
# the assembled router mounts them, and stages the input a job reads through that
# service's OWN `PutObject` — so what an import reads is what Amazon S3 really
# holds. DEV-ONLY: this crate depends on no other service's crate outside its
# tests.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# Decodes the `application/vnd.amazon.eventstream` frames the agent suite reads back,
# so what is asserted is the wire an SDK's event-stream decoder sees.
aws-smithy-eventstream = "0.60"

[lints]
workspace = true
