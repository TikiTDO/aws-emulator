[package]
name = "service-com-amazonaws-pcaconnectorscep-pcaconnectorscep"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mixes the per-identifier counter and the clock into the UUID-format connector/challenge
# ids and the challenge passwords the ARN patterns and the `Password` member's doc require.
sha2 = { workspace = true }
# Lays those digest bytes out as a UUID: the version and variant nibbles, and the canonical
# hyphenated rendering (see `state::new_uuid`). No feature is named because
# `Builder::from_random_bytes` needs none — the bytes come from the digest above, not from
# `uuid`'s own generators, so the `v4` feature other crates here enable is deliberately off.
uuid = "1"
# Hex: the opaque `NextToken` both listings page with.
hex = { workspace = true }
# The tree's one reading of how a client ADDRESSES an emulated data plane: the reserved
# path namespace a plane served on the emulator's own endpoint sits under, the host a
# request reached, and whether that host names a service at all.
service-common = { path = "../common" }
# Reads the PEM framing the private CA publishes its certificate in, so the connector's
# SCEP `GetCACert` can answer the DER certificate inside it. A maintained PEM reader
# rather than a hand-rolled one: this decodes a body the emulator holds for a caller.
pem = "3"
# Amazon Web Services Private CA client the connector's SCEP data plane reads its CA
# certificate through (`GetCertificateAuthorityCertificate`), called over the in-process
# callback into this same emulator — no network client feature is enabled, so the
# transport is the emulator's own.
aws-sdk-acmpca = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[dev-dependencies]
# The SCEP data-plane suite mounts Amazon Web Services Private CA beside this service on
# one engine — what the assembled emulator does — because a connector's `GetCACert`
# answers the certificate that service holds for the CA the connector names.
service-com-amazonaws-acmpca-acmprivateca = { workspace = true }
# Reads the subject and serial number out of the DER certificate the SCEP plane answers,
# so the suite compares it with the one the private CA holds.
x509-cert = "0.2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
