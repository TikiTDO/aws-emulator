[package]
name = "service-com-amazonaws-elasticbeanstalk-awselasticbeanstalkservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Amazon S3 client the two creates that build a resource FROM a caller-named archive
# (CreateApplicationVersion's SourceBundle, CreatePlatformVersion's
# PlatformDefinitionBundle) download that archive with, over the in-process callback
# into this same emulator (no network client feature is enabled: the transport is the
# emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The digest and the hexadecimal rendering a scheduled managed action's `ActionId` is
# derived with, from the environment, the work and the window that identify it. Already
# this crate's (the source-bundle suite checksums an archive with the same two), so the
# id needs no hash or codec written here.
sha2 = { workspace = true }
hex = { workspace = true }
# An Elastic Beanstalk source bundle is a single .zip (or .war, which is one too), and
# `CreateApplicationVersion$Process` pre-processes the files INSIDE it, so the archive
# format is read by the archive reader rather than by this emulator.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The HTTP/1.1 server the socket an environment's own address is served on speaks
# (`src/state/environment_plane_endpoint.rs`): the core hands that socket a plain TCP
# connection, so the HTTP framing on it is the `hyper` server's rather than this
# emulator's. `hyper-util` carries the tokio IO and timer adapters for it, and
# `http-body-util` the bounded body reader and the one-shot body.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# `rquickjs` is the QuickJS JavaScript engine, embedded in this process, which is what RUNS
# the application an environment deploys: an Elastic Beanstalk environment's observable
# outputs — the log lines the compiled environment information carries and the content the
# environment's own address serves — are produced by the deployed bundle's own entry point,
# so that code is executed rather than interpreted by hand (`state::application_runtime`).
# It is also a NATIVE component: `rquickjs-sys` compiles the QuickJS C sources with `cc`
# inside this build, so nothing is fetched or started outside this process.
rquickjs = "0.14"
# Parses the `env.yaml` manifest and the `.ebextensions/*.config` files that
# pre-processing validates; yaml-rust2 is the pure-Rust YAML 1.2 implementation the
# other services that read caller-supplied YAML use (YAML 1.2 is a superset of JSON,
# which a configuration file may be written in instead).
yaml-rust2 = { version = "0.10", default-features = false }
# The AWS SDK for SNS, driven over the in-process callback
# (`OperationContext::callback`): an environment whose configuration names an Elastic
# Beanstalk notification topic has its events published to that topic with `Publish`, and
# a configuration naming only an endpoint has the topic created and the endpoint
# subscribed (`state::event_notifications`). Only the generated client is needed — the
# emulator supplies the transport.
aws-sdk-sns = { version = "1", default-features = false }
# The ONE shared evaluation of IAM policy documents against a request, which the
# authorization gate (`service::authorization`) takes its decision through.
service-common = { path = "../common" }
# The account's own identities: the IAM store holds the role session a temporary
# credential speaks for and the user a long-term key belongs to, plus the policy documents
# in force on each, which is what that gate reads the caller's permissions from.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The source-bundle suite mounts the S3 service beside Elastic Beanstalk on one engine,
# because CreateApplicationVersion and CreatePlatformVersion download the archive their
# request names by calling object storage in process.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The pre-processing suite writes the source bundles it uploads in memory, the way a
# caller writes the .zip it uploads.
zip = { version = "9", default-features = false, features = ["deflate"] }
# SNS is mounted beside Elastic Beanstalk on one engine in the environment-notification
# suite, because an environment's notifications are published to an SNS topic and the
# delivery is asserted where a client sees it: on the queue subscribed to that topic.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# SQS is mounted with it, because that subscriber is a queue and the delivered
# notification is read from it.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[lints]
workspace = true
