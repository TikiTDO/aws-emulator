[package]
name = "service-com-amazonaws-cognitoidentityprovider-awscognitoidentityproviderservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
service-common = { path = "../common" }
# The WAFv2 web ACL in front of a user pool decides the pool's API operations
# (`src/service/web_acl.rs`): the association and the rule evaluation are WAFv2's own
# records and its own data plane, read through that crate rather than copied here.
service-com-amazonaws-wafv2-awswaf-20190729 = { workspace = true }
# A user pool's authentication and registration traffic publishes the AWS/Cognito metric
# series a client watches it through (`src/state/auth_metrics.rs`): the datapoints go into
# CloudWatch's OWN metric store, the one `GetMetricStatistics` and `ListMetrics` read, so
# one metric has one home.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The IAM store holds the access keys of the account's users and the identity-based
# policies in force on them: the authorization gate in front of this service's signed
# operations (`src/service/iam_authorization.rs`) reads IAM's OWN state accessors rather
# than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# Invoking a user pool's configured Lambda triggers, over the in-process callback
# into this same emulator (`src/state/lambda_triggers.rs`).
aws-sdk-lambda = { version = "1", default-features = false }
# The clients that resolve a user pool's log delivery destinations where the services
# that own them hold them, over the in-process callback into this same emulator
# (`src/ops/set_log_delivery_configuration/log_destinations.rs`): a CloudWatch Logs log
# group, an Amazon Data Firehose stream and an Amazon S3 bucket. No network client
# feature is enabled: the transport is the emulator's own.
aws-sdk-cloudwatchlogs = { version = "1", default-features = false }
# The key a pool's `LambdaConfig.KMSKeyID` names wraps the data key of the message a custom
# sender trigger's code travels in (`src/state/lambda_triggers/custom_email.rs`), over the
# in-process callback into this same emulator.
aws-sdk-kms = { version = "1", default-features = false }
# Pinned: from 1.127.0 this client requires `aws-smithy-http` 0.64.3, which the
# workspace's signing stack does not resolve to; 1.126.0 is the newest release that
# builds against the `aws-smithy-http` this lock already holds.
aws-sdk-firehose = { version = "=1.126.0", default-features = false }
aws-sdk-s3 = { version = "1", default-features = false }
# `time` on top of the workspace features: a user-pool Lambda trigger invocation is
# bounded by Amazon Cognito's own trigger budget (`src/state/lambda_triggers.rs`), which
# `tokio::time::timeout` applies.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Key generation and ES256 (ECDSA on NIST P-256 with SHA-256, RFC 7518 §3.4)
# signing of the user-pool tokens, plus the public curve point the pool's JWKS
# publishes. ES256 rather than the RS256 AWS uses because the only maintained
# pure-Rust RSA implementation carries two unfixable timing advisories
# (RUSTSEC-2023-0071, GHSA-4grx-2x9w-596c) this repository's dependency audit
# blocks; what a verifier checks is unchanged (see `src/state.rs`). `ring`
# rather than a pure-Rust P-256 crate because every released version of those
# resolves to a `crypto-bigint` the audit blocks (RUSTSEC-2026-0387), and this
# workspace already builds `ring`.
ring = "0.17"
# SHA-256 for the RFC 7638 JWK thumbprint used as the key's `kid`.
sha2 = { workspace = true }
# A custom sender trigger's event carries the encrypted code as text, so the message is
# base64-encoded into it (`src/state/lambda_triggers/custom_email.rs`).
base64 = "0.22"
# Constant-time byte comparison, for checking a presented app client secret
# against the stored one without leaking how much of it matched. `ring`'s own
# `constant_time::verify_slices_are_equal` is deprecated, which this
# workspace's `-D warnings` build rejects.
subtle = "2.6"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# The custom-sender suite mounts the services that own the other halves of that trigger
# beside this one on a single engine — exactly as the assembled emulator does — because the
# trigger wraps the code with a key the key service holds and hands it to a function Lambda
# holds, which in turn writes what it received to a queue.
service-com-amazonaws-kms-trentservice = { workspace = true }
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# A deployment package is a .zip archive, and the trigger function's module is one entry in
# it.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The log-delivery suite mounts the services that OWN a user pool's log delivery
# destinations beside this one on a single engine — exactly as the assembled emulator
# does — because `SetLogDeliveryConfiguration` resolves each destination by calling
# them in process.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
service-com-amazonaws-firehose-firehose-20150804 = { workspace = true }
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The authorization suite makes the principals it calls as through IAM's own operations,
# so the documents the gate reads are the ones that service wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[lints]
workspace = true
