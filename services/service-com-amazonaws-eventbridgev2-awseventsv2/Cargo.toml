[package]
name = "service-com-amazonaws-eventbridgev2-awseventsv2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex, to render the opaque ListEventBuses NextToken from the page cursor and
# the content-deduplication digest PutEvents indexes an event under.
hex = { workspace = true }
# SHA-256, for the "hash of the event content" CONTENT_BASED deduplication keys
# PutEvents entries on: a fixed-width key keeps that index small whatever the
# size of the event.
sha2 = { workspace = true }
# `event_pattern`: the ONE reading and evaluation of an EventBridge event
# pattern, which is the language a subscriber's `FilterConfiguration` filters
# are written in; `arn`: the one parse of a target ARN, so this crate does not
# split a caller's ARN its own way (`state::subscribers`,
# `state::subscriber_delivery`).
service-common = { path = "../common" }
# The AWS SDK for Amazon SQS, driven over the in-process callback
# (`OperationContext::callback`): a subscriber whose target is a queue delivers
# each matching event with `SendMessageBatch`, the API `SqsParameters` states
# its values are forwarded to. Only the generated client is needed — the
# emulator supplies the transport, so the SDK's own HTTPS stack and runtime are
# left out.
aws-sdk-sqs = { version = "1", default-features = false }

[dev-dependencies]
# Amazon SQS, mounted beside this service on one engine in the delivery suite,
# because a delivery is asserted where a client sees it: on the queue the
# subscriber's target names.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
