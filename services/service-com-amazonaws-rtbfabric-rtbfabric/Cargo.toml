[package]
name = "service-com-amazonaws-rtbfabric-rtbfabric"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` is needed by this crate's tests, which wait for a clock-owed status
# transition to come due (`tokio::time::sleep`).
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# Hex renders and reads back the opaque `nextToken` a paginated listing hands
# out, so a cursor survives any transport and no client mistakes it for a value
# it may construct itself.
hex = { workspace = true }
# SHA-256 for the fixed-size digests the idempotency store is keyed and compared
# by, so a caller-chosen clientToken cannot grow the bytes retained per record.
sha2 = { workspace = true }
tracing = { workspace = true }
# `validation_message`: the cross-service home for the words AWS states a boundary
# refusal with — the `N validation error(s) detected:` envelope, the requirement
# sentences and the unanchored `@pattern` expression — which `src/service/validation.rs`
# delegates this service's refusal wording to.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
