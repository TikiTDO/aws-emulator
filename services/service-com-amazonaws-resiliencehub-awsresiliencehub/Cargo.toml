[package]
name = "service-com-amazonaws-resiliencehub-awsresiliencehub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `validation_message`: the bracketed constraint report this service states for a value
# outside a member's `@pattern`, shared with the V2 endpoint of the same service.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `nextToken` ListApps hands out. Already recorded as an
# edge of this package in Cargo.lock (which does not distinguish a dev dependency),
# so declaring it here leaves the lock file untouched.
hex = { workspace = true }
# Mints the version-4 UUIDs this service's server-generated identifiers (appArn and
# policyArn ids, resolutionId) are, rather than hand-rolling the version/variant bits.
uuid = { version = "1", features = ["v4"] }
# Digests the app-version resource mapping whose own identity ListAppVersionResources
# reports when no resolution of that version was ever started. Already recorded as an
# edge of this package in Cargo.lock (which does not distinguish a dev dependency), so
# moving it out of [dev-dependencies] leaves the lock file untouched.
sha2 = { workspace = true }
# The owning-service reads `state::mapped_resources` resolves a mapping's physical
# resource through, over the emulator's own in-process callback: the object store's
# bucket listing, the queue's url, the topic's attributes, the table's and the
# function's description. Each is that service's own read, so a mapping is refused
# only where the component owning the resource says it holds none.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-sns = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-lambda = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
