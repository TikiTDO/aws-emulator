[package]
name = "service-com-amazonaws-ecr-amazonec2containerregistry-v20150921"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The content digest of an image manifest (`sha256:<hex>`) and its hex rendering.
sha2 = { workspace = true }
hex = { workspace = true }
# Reading a registered image layer's filesystem: a layer blob is a tar archive, usually
# gzip-compressed, and a basic image scan has to look inside it for the operating-system
# release file and the package database it carries.
tar = "0.4"
flate2 = "1"
# `arn::parse_of` / `iam_role::role_name`: the tree's ONE resource-ARN parse and its one
# IAM role-ARN reading, which this service's `resourceArn`, `credentialArn` and
# `customRoleArn` readings go through rather than splitting an ARN of their own.
# `json_document::minified`: the one minification of a JSON document a service reports
# back, which the lifecycle policy document goes through.
service-common = { path = "../common" }
# The IAM store holds the identity-based policies of the principal a request speaks for,
# and the STS store resolves which principal that is: `state::authorization` reads both
# services' OWN state accessors rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The CloudWatch store holds the `AWS/ECR` series this registry publishes about the pulls
# its data plane serves (`state::pull_metrics`): the datapoints are appended to the very
# store `GetMetricStatistics` reads, because CloudWatch refuses a publish into an `AWS/`
# namespace over `PutMetricData`.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# Whether a signing job a push creates can sign at all is AWS Signer's judgement about its
# own resource: `state::signing` resolves the signing profile a signing rule names through
# Signer's OWN store (`profile_region_and_name_in_arn`, `profile`, `can_sign`) rather than
# keeping a second copy of what profiles exist.
service-com-amazonaws-signer-wallabyservice = { workspace = true }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): an image action on a repository — a push, a
# delete — is published onto the account's default event bus
# (`state::image_events`). Only the generated client is needed — the emulator
# supplies the transport, so the SDK's own HTTPS stack and runtime are left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# Computes the query-string SigV4 signature a published layer download URL carries, and
# the one the download plane verifies before serving a byte
# (`state::presigned_layer_download_url`).
aws-sigv4 = { version = "1", features = ["http1"] }
# The signing identity `aws-sigv4` takes: this registry's own ephemeral download-plane key.
aws-credential-types = "1"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Opt-in harmless real Docker publication witness; no host credentials inherited.
reqwest = { workspace = true }
tempfile = "3"
