[package]
name = "service-com-amazonaws-sqs-amazonsqs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` is needed for ReceiveMessage long polling (WaitTimeSeconds), and `rt` for the one
# bounded in-process task that keeps publishing a queue's backlog while it has one
# (`state::queue_depth_metrics`).
tokio = { workspace = true, features = ["time", "rt"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# MD5 of a message body / of the message-attribute encoding, which SQS returns.
md-5 = "0.10"
# Hex rendering of those digests.
hex = { workspace = true }
# SHA-256 of a message body, which is the deduplication token a FIFO queue with
# ContentBasedDeduplication derives for it.
sha2 = { workspace = true }
# MessageId / ReceiptHandle identifiers.
uuid = { version = "1", features = ["v4"] }
# `iam_authorization`: the shared evaluation of policy documents against
# (action, resource, principal), which the queue-policy gate runs on every call that
# acts on a queue, and which decides whether a caller may have a queue's customer
# managed KMS key used for it. `arn`: the one parse of an ARN.
service-common = { path = "../common" }
# A queue on a customer managed key is encrypted with a key the KMS service holds: its
# existence, its key state and its key policy are read from that service's OWN state
# accessors rather than from a second copy of them here.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The STS store resolves which principal a request speaks for, and the IAM store holds
# that principal's identity-based policies: the documents the queue-policy gate decides
# with, and the two a KMS key policy delegating to IAM is decided with.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The CloudWatch metric store is where a queue's `AWS/SQS` backlog series live: the depth
# samples this service publishes are appended to that service's OWN series — the ones
# `GetMetricStatistics`, `ListMetrics` and the alarm evaluation read — rather than to a second
# copy of them (`state::queue_depth_metrics`).
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The encryption suite makes the keys and principals it drives through KMS's, IAM's and
# STS's own operations, mounted beside this service on one engine, so the key policies and
# identity policies it asserts on are the ones those services wrote.
service-com-amazonaws-kms-trentservice = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[lints]
workspace = true
