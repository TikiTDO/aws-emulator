[package]
name = "service-com-amazonaws-mediatailor-mediatailor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Derives each playback configuration's stable endpoint host label and path id
# from its ARN.
sha2 = { workspace = true }
hex = { workspace = true }
# `service-common` owns this tree's ONE statement of the request id a response
# names its request by, which this service reports in the `requestId` member of
# its JSON error bodies, and its ONE framing of an answer that carries no content,
# which this service's two tagging writes answer with (HTTP 204).
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Percent-encodes the URI path labels and query values the test's requests carry,
# rather than carrying a second hand-written encoder. Pinned here rather than
# through `[workspace.dependencies]` because the root manifest is not editable
# from a service crate.
percent-encoding = "2"

[lints]
workspace = true
