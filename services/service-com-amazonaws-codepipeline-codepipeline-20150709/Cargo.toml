[package]
name = "service-com-amazonaws-codepipeline-codepipeline-20150709"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The shared validation-message rules: `unanchored` is the staged home for rendering a
# `@pattern` as the expression a value must satisfy, so this crate calls it rather than
# inlining another copy.
service-common = { path = "../common" }
# The S3 client the pipeline execution engine moves artifacts with, over the in-process
# callback into this same emulator (no network client feature: the transport is the
# emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The IAM client CreatePipeline checks the declaration's roleArn against.
aws-sdk-iam = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The CodeCommit client a CodeCommit source action resolves its branch tip and reads the
# revision's files with, over the same in-process callback.
aws-sdk-codecommit = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The Lambda client an invoke action performs its work with, over the same callback.
aws-sdk-lambda = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The Amazon ECR client an ECR source action resolves the image it sources with, over the
# same in-process callback (`state::driver::image_source`).
aws-sdk-ecr = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The KMS client the execution engine takes the data key an artifact store's customer
# managed key encrypts each artifact object with from, over the same callback: a key KMS
# will not let this account use is an artifact that cannot be produced
# (`state::driver::artifact_data_key`).
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The STS session registry, so the identity this service records for a request (the
# reviewer an approval's `lastUpdatedBy` names) is the principal the credential it was
# signed with was minted for (see `crate::state::caller_identity_arn`).
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The CodeBuild client a Build action starts its build and reads that build with, over the
# same in-process callback (`state::driver::build_action`).
aws-sdk-codebuild = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Renders the instant an image was pushed in the form the `imageDetail.json` document an
# ECR source action produces carries it in, rather than formatting a date by hand.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The EventBridge client this service publishes its own state-change events with, over
# the same in-process callback: a pipeline execution, each of its stages and each of
# their actions publish one event per state change onto the account's default event bus
# (`state::events`). Only the generated client is needed — the emulator supplies the
# transport.
aws-sdk-eventbridge = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Reader for the artifact archive an S3 deploy action with Extract=true unzips.
# Pinned to 9.x: RUSTSEC-2026-0368 affects every earlier release.
#
# The archive is CALLER-supplied (the bytes of an object a caller uploaded), so the
# extraction is clamped before anything is allocated from it, at its one use site
# (`state::driver::run_deploy`): at most `state::execution::MAX_ARCHIVE_ENTRIES` (1,024)
# entries are read, and the running total of uncompressed bytes written is checked
# against `state::execution::MAX_EXTRACTED_BYTES` (16 MiB) BEFORE each entry's bytes are
# read, so neither the entry count nor the uncompressed size a declaration can ask for
# grows the store or the heap past those figures.
zip = { version = "9", default-features = false, features = ["deflate"] }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Whether the caller's identity-based policies allow a stage-transition call is decided
# from the documents IAM holds for that principal and the session STS resolves the
# request's access key id to (the STS registry above), read through those services' own
# state accessors rather than from a second copy of them here
# (`state::identity_authorization`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# Parses a webhook filter's `jsonPath` so `PutWebhook` refuses one that is not a
# JsonPath expression, rather than this crate hand-writing the grammar.
serde_json_path = "0.7"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The Lambda deployment package and the CodeCommit file content a test uploads are
# blobs, which the JSON wire form carries base64-encoded.
base64 = "0.22"
# The execution tests mount S3, IAM, CodeCommit and Lambda beside codepipeline on one
# engine, because the execution engine performs its actions' work through them and
# CreatePipeline checks the role in IAM.
service-com-amazonaws-s3-amazons3 = { workspace = true }
service-com-amazonaws-codecommit-codecommit-20150413 = { workspace = true }
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# EventBridge and SQS are mounted beside codepipeline in the state-change event suite,
# because the execution plane publishes its events onto the default event bus and a rule
# on that bus delivers them to an SQS queue target: without them mounted there is
# nothing for the publication to reach.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# Amazon ECR and CodeBuild are mounted beside codepipeline in the image-and-build suite,
# because an ECR source action resolves its image in that registry and a CodeBuild action
# starts its build in that service: without them mounted there is nothing for either
# action's work to reach.
service-com-amazonaws-ecr-amazonec2containerregistry-v20150921 = { workspace = true }
service-com-amazonaws-codebuild-codebuild-20161006 = { workspace = true }
# KMS is mounted beside codepipeline in the artifact-store-encryption suite, because the
# key an artifact store declares is a key of that service: without it mounted there is no
# key for an artifact's encryption to be taken from.
service-com-amazonaws-kms-trentservice = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
