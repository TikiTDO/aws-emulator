[package]
name = "service-com-amazonaws-route53resolver-route53resolver"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Stable digests behind the minted HostVPCId and the pagination cursor's checksum.
sha2 = { workspace = true }
# Hex encoding for those digests and for the opaque pagination cursor.
hex = { workspace = true }
# The account's own Amazon EC2 inventory: an endpoint's IP addresses are placed
# in VPC subnets, which are resolved against the subnets that service holds.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# The account's own AWS Outposts inventory: `CreateOutpostResolver` resolves its
# `OutpostArn` against the Outposts that service holds.
service-com-amazonaws-outposts-outpostsolafservice = { workspace = true }
# The account's own Amazon S3 inventory: the domain file `ImportFirewallDomains`
# reads is an object of that store, read through its own accessors
# (`state::domain_imports`), and an S3 bucket is one of the destinations a
# Resolver query logging configuration delivers to.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The other inventories a query logging configuration's `DestinationArn` is
# resolved against (`state::query_log_destinations`): a CloudWatch Logs log
# group, a Kinesis data stream and a Kinesis Data Firehose delivery stream.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }
service-com-amazonaws-firehose-firehose-20150804 = { workspace = true }
# The account's own Route 53 Profiles inventory: `ResolverConfig$ResourceId` is a
# VPC or a Route 53 Profile, so the Resolver behavior configuration resolves the
# id it is given against the Profiles that service holds as well.
service-com-amazonaws-route53profiles-route53profiles = { workspace = true }
# The ONE reading and minting of an AWS X-Ray trace id, which the refusals of the
# per-VPC configuration operations close with.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
