[package]
name = "service-com-amazonaws-sagemakerruntime-amazonsagemakerruntime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `InvokeEndpoint` is the data plane of an endpoint the SageMaker CONTROL PLANE owns:
# the endpoint is resolved in that service's own store through the shared engine, which
# needs the owning service's state TYPE.
service-com-amazonaws-sagemaker-sagemaker = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The services a caller's own identity is made with:
# `tests/all/invocation_authorization.rs` creates roles with IAM's own operations and
# assumes them through STS, so the identity-based documents the authorization gate reads
# are the ones those services wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[lints]
workspace = true
