[package]
name = "service-com-amazonaws-rekognition-rekognitionservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The digest that tells whether two indexed faces came from the same image, and the
# one the minted `FaceId` / `ImageId` are built from.
sha2 = { workspace = true }
# Opaque list-pagination cursors: the next page's start key, hex-encoded.
hex = { workspace = true }
# Decodes the image formats `DetectFaces` accepts (PNG, JPEG) into the pixels the face
# detector measures.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
# The Amazon S3 client an `Image.S3Object` is read through, over the in-process callback
# into this same emulator (no network client feature: the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The Amazon S3 service, mounted beside rekognition on one engine so an image staged with
# `PutObject` is the one an `Image.S3Object` resolves to.
service-com-amazonaws-s3-amazons3 = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }

[lints]
workspace = true
