[package]
name = "service-com-amazonaws-iotmanagedintegrations-iotmanagedintegrations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The shared ARN requirement and IAM reading a destination's `RoleArn` is resolved
# through (src/state/references.rs).
service-common = { path = "../common" }
# Resolves a cloud connector endpoint's Lambda function against the emulator's own
# Lambda, through the in-process callback (src/state/references.rs).
aws-sdk-lambda = { version = "1", default-features = false }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Draws the random 128-bit value behind every identifier this service mints
# (src/state.rs `opaque_id`), so an id carries no creation time and no creation order.
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# `tokio::time::sleep` in tests/all/managed_thing_lifecycle.rs separates a create
# from the update whose `UpdatedAt` bump it asserts.
tokio = { workspace = true, features = ["time"] }
# Mounted beside this service in tests/all/referenced_resource_validation.rs, so the
# Lambda function a connector endpoint resolves and the IAM role a destination
# delivers as are records the emulator really holds.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# Encodes the deployment package of the Lambda function that suite creates, which
# restJson1 carries base64-encoded.
base64 = "0.22"

[lints]
workspace = true
