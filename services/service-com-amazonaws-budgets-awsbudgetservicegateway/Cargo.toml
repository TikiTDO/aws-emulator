[package]
name = "service-com-amazonaws-budgets-awsbudgetservicegateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `NextToken` the paginated Describe* operations mint.
hex = { workspace = true }
# Mints the UUID `ActionId` CreateBudgetAction gives a new budget action — "a
# system-generated universally unique identifier (UUID) for the action" (`Action$ActionId`).
uuid = { version = "1", features = ["v4"] }
# `arn`: the ONE parse of a caller-supplied resource ARN, shared with every other
# service — the topic an SNS subscriber's `Address` names, and the account a budget
# action's `ExecutionRoleArn` names, are read through it rather than split here.
service-common = { path = "../common" }
# The AWS SDK for Amazon SNS, driven over the in-process callback
# (`OperationContext::callback`): a notification in the `ALARM` state publishes its
# budget alert to each `SNS` subscriber's topic (`state::alerts`). Only the generated
# client is needed — the emulator supplies the transport, so the SDK's own HTTPS stack
# and runtime are left out.
aws-sdk-sns = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# SNS is mounted beside budgets on one engine in the alert-delivery suite, because a
# budget alert is asserted where a client sees it: on the topic the subscriber named.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# IAM is mounted beside budgets on one engine in the execution-role and
# definition-effect suites, because the role a budget action is written with exists only if
# IAM answers for it, and the policy an executed action attaches is asserted where a client
# sees it — on the identity IAM holds it against. The roles, users, groups and policies
# those suites create are created through IAM's own operations, over this client.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
aws-sdk-iam = { version = "1", default-features = false }
# Systems Manager and AWS Organizations are mounted beside budgets on one engine in the
# definition-effect suite too, because the document a `RUN_SSM_DOCUMENTS` action runs and the
# service control policy an `APPLY_SCP_POLICY` action attaches are performed by those
# services, so what each answers is what the action's status reports.
service-com-amazonaws-ssm-amazonssm = { workspace = true }
service-com-amazonaws-organizations-awsorganizationsv20161128 = { workspace = true }

[lints]
workspace = true
