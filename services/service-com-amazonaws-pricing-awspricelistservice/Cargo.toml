[package]
name = "service-com-amazonaws-pricing-awspricelistservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `validation_message`: the shared wording of a boundary refusal, including the
# anchor-free quoting of a `@pattern` requirement, so this crate spells neither the
# envelope nor a clause itself.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes the query a NextToken belongs to, so a token minted for one query cannot be
# replayed against another.
sha2 = { workspace = true }
# Encodes/decodes the opaque NextToken payload.
hex = { workspace = true }
# Writes the CSV form of a price-list file.
csv = "1.3"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
