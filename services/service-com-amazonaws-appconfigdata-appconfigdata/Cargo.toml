[package]
name = "service-com-amazonaws-appconfigdata-appconfigdata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
# `validation::refusing_violations`: the shared collecting half of a pre-handler
# refusal, so this service words its own modelled `BadRequestException` from the
# framework's own violation set rather than re-walking the input itself.
service-common = { path = "../common" }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Token minting: an opaque, collision-free configuration token is the SHA-256 of
# this store's mint counter and the mint instant, hex-encoded.
sha2 = { workspace = true }
hex = { workspace = true }
# AppConfigData is AppConfig's data plane: the applications, environments,
# configuration profiles, hosted versions and deployments a session resolves
# against live in the AppConfig control plane's own store, read through the one
# shared engine.
service-com-amazonaws-appconfig-amazonappconfig = { workspace = true }
# A session is opened and polled under the CALLER's own credentials, and AWS decides such
# a call against that principal's identity-based policies before the service reads the
# request (`state::identity_authorization`): the principal the access key id speaks for is
# the session the token service minted it for — the record `GetCallerIdentity` answers
# from — and the policies in force on it live in the IAM emulator's own store. Both are
# reached through the one shared engine, which needs the owning services' state TYPES.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
