[package]
name = "service-com-amazonaws-connectcampaignsv2-amazonconnectcampaignservicev2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Codec for the opaque `ListCampaigns` nextToken cursor.
hex = { workspace = true }
# Digest of the listing a nextToken cursor was minted by, so the token is a resume
# point for that listing alone and stays a fixed size however it was scoped.
sha2 = { workspace = true }
# The Amazon Connect instance gate both ConnectCampaigns API versions apply — whether the
# account's Connect registry holds the `connectInstanceId` a request names, and the
# distinction between an id it does not hold and a registry that could not be read at all:
# the tree's one statement of that rule.
service-common = { path = "../common" }
# Amazon Connect's instance registry: an instance id is minted by Connect's
# `CreateInstance` and by nothing else, so the instance-existence gate on onboarding
# reads that store through the shared engine rather than keeping a second registry here.
service-com-amazonaws-connect-amazonconnectservice = { workspace = true }
# AWS KMS's key store: the `encryptionConfig.keyArn` an onboarding job is put on is a KMS
# key KMS itself mints, so the job's dependency check resolves that key in KMS's own store
# through the shared engine instead of reading the ARN's text.
service-com-amazonaws-kms-trentservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
