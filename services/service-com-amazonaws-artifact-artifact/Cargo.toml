[package]
name = "service-com-amazonaws-artifact-artifact"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries the workspace's ONE free-text search over a stored document's
# text, which is what retrieves the sources a compliance-inquiry query is answered from,
# and the ARN form a caller-supplied `resourceArn` is read against, shared with every other
# service that binds one, so the tagging surface's syntax refusal cannot disagree with
# theirs.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Writes the PDF report documents this service's data plane serves, so a report
# document is produced by a PDF writer rather than hand-assembled bytes.
pdf-writer = "0.13"
# RFC 3986 percent-encoding for the `termToken` the announced document URL carries, so the
# URL is well formed for every token the model's `TermToken` admits.
percent-encoding = "2"
# Digests the `clientToken` idempotency record fingerprints a create request with, and
# seals the opaque `nextToken` pagination cursors in `src/state.rs`.
sha2 = { workspace = true }
# Renders those digests as the hex strings the idempotency record and the pagination
# cursors are encoded as.
hex = { workspace = true }
# Mints the download token an export's presigned URL carries, which is what authorises an
# unsigned fetch of that document: a v4 UUID, so a caller that was handed no URL holds
# nothing that fits.
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
