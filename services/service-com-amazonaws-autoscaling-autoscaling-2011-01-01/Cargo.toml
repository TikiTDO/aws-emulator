[package]
name = "service-com-amazonaws-autoscaling-autoscaling-2011-01-01"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time`: the clock pump that publishes a group's instance lifecycle events as they fall
# due waits for the earliest due instant the store holds
# (`state::lifecycle_events::drive_lifecycle_clock`).
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the `<RequestId>` the awsQuery error envelope carries (see
# `service::query_error_envelope`), the same v4 UUID form the framework's query
# renderer puts in a successful response's `ResponseMetadata/RequestId`.
uuid = { version = "1", features = ["v4"] }
# The EC2 store holds the account's subnets, and a subnet's Availability Zone is a fact
# about that subnet: a group that names only `VPCZoneIdentifier` has its zones resolved
# from EC2's own state (`state::ec2_subnets`) rather than asked of the caller. It also
# holds the account's launch templates, which a group launches its instances from.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# The account's own IAM store holds the identity-based policies and the permissions
# boundary in force on the principal a request speaks for, which is what the authorization
# gate decides an account-wide read from (`service::authorization`). A launch template's
# `IamInstanceProfile` is a reference EC2 stores verbatim and this service resolves when it
# consumes the template, so the account's own IAM instance profiles are read from IAM's own
# state (`state::iam_instance_profiles`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The account's own STS store resolves WHICH principal an access key id speaks for — the
# same answer `sts:GetCallerIdentity` gives — so the authorization gate blames the principal
# the caller reads back for the credential it signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The account's own CloudWatch store holds the alarms a target-tracking scaling policy is
# driven by: `PutScalingPolicy` materialises them there and reports back the ones that store
# holds, so an alarm this service reports is one CloudWatch's own `DescribeAlarms` resolves
# (`state::scaling_policies`).
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# `service-common` carries the ONE reading of which IAM entity a caller-supplied IAM ARN
# names, which that instance-profile ARN is read through, and the ONE in-process
# EventBridge client an emulated service publishes an event through.
service-common = { path = "../common" }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): Amazon EC2 Auto Scaling publishes an `EC2 Instance Launch
# Successful` / `EC2 Instance Terminate Successful` event onto the account's default event
# bus as a group's capacity changes (`state::lifecycle_events`). Only the generated client
# is needed — the emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-eventbridge = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# EventBridge and Amazon SQS are mounted beside Amazon EC2 Auto Scaling on one engine in the
# integration tests, because this service publishes an instance lifecycle event onto the
# default event bus as a group scales and a rule on that bus delivers it to an SQS queue:
# without them mounted there is nothing for the publication to reach.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[lints]
workspace = true
