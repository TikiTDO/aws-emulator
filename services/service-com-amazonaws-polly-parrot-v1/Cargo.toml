[package]
name = "service-com-amazonaws-polly-parrot-v1"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The `vnd.amazon.eventstream` framing, the request reader and the routing seam the
# hand-authored `StartSpeechSynthesisStream` needs, plus the shared request-path
# reader that routes it.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination tokens are hex-encoded, so a garbage token is detectable.
hex = { workspace = true }
# PLS lexicon documents (PutLexicon `Content`) are XML: parse them with a real
# XML reader rather than scanning the text by hand.
# >= 0.41 is required: RUSTSEC-2026-0195 affects 0.37.
quick-xml = "0.41"
# Ogg bitstream framing (pages, lacing, CRC) for the ogg_opus output format.
ogg = "0.9"
# The Vorbis encoder behind the ogg_vorbis output format: a conformant Vorbis stream
# needs the codebooks of a real encoder's setup header, which this builds, so the
# emulator does not hand-roll a bitstream no decoder accepts. Pinned to a released
# version. It is a NATIVE component: its `-sys` crates compile the bundled aoTuV/libogg C
# sources with `cc` at build time (as `aws-lc-sys` and `libsqlite3-sys` already do here),
# and it is a library computing over samples in-process — it opens no listener, starts no
# process, reads no file and makes no outbound connection. `default-features = false`
# drops its random stream-serial generator, because one response is exactly one logical
# stream with a fixed serial.
vorbis_rs = { version = "0.5", default-features = false }
# `TaskId`s are UUIDs: mint and recognise them with a real UUID implementation
# rather than scanning the text by hand. `v5` is for the deterministic task ids
# the test fixtures derive from a label.
uuid = { version = "1", features = ["v4", "v5"] }
# The in-process Amazon S3 client a completed synthesis task writes its output object
# through (built once in `service-common::s3_client`): only the types the write itself takes
# are named here. Only the generated client is needed \u2014 the emulator supplies the transport,
# so the SDK's own HTTPS stack is left out and this client can reach nothing off this process.
aws-sdk-s3 = { version = "1", default-features = false }
# Encodes and decodes one `application/vnd.amazon.eventstream` frame:
# `StartSpeechSynthesisStream` reads the caller's action events out of the request
# body and writes each `AudioEvent` frame, whose `@eventPayload` chunk the
# protocol's generic event serializer cannot express.
aws-smithy-eventstream = "0.60"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The object store a completed synthesis task writes its output into: mounted beside this
# service in the suites about that output, so the fact that the object arrived is answered
# by the service that OWNS it rather than by this crate.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
