[package]
name = "service-com-amazonaws-bcmrecommendedactions-awsbillingandcostmanagementrecommendedactions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Fingerprints the effective query a `nextToken` resumes, so a token cannot
# resume a listing of a different filter/maxResults combination.
sha2 = { workspace = true }
# Renders that fingerprint (and the resume offset) as the token's hex text.
hex = { workspace = true }
# Decodes a supplied `nextToken`'s base64 payload, whose leading bytes name the
# wrapping schema a refusal of an unusable token reports.
base64 = "0.22"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
