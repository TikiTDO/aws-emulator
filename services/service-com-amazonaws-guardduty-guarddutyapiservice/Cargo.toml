[package]
name = "service-com-amazonaws-guardduty-guarddutyapiservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Parses an entity set's `Location` as a URL, so a valid Amazon S3 URL is told
# from an invalid one by the URL grammar rather than by string matching.
url = "2"
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the Runtime Monitoring coverage report asks EC2
# for the instances of the account, because the account's instances are EC2's.
# Only the generated client is needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# The AWS SDK for EKS, over the same callback: the coverage report asks EKS for
# the account's clusters and for the GuardDuty security agent add-on installed on
# each, because both are EKS resources.
aws-sdk-eks = { version = "1", default-features = false }
# Digests the identity of the ordered list a page token is a position in, so the
# token names its own listing; `hex` renders that digest into the token.
sha2 = { workspace = true }
hex = { workspace = true }
# `service-common` carries the shared readings of a caller-supplied IAM role ARN —
# which role of this account it names, and what this account's IAM records say that
# role may do — which a Malware Protection plan's `Role` is held to before a plan is
# recorded, rather than a copy of that reading here.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
