[package]
name = "service-com-amazonaws-acmpca-acmprivateca"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digests the CA's minted ids/serials and the certification-request fingerprint a
# derived certificate body records.
sha2 = { workspace = true }
# Hex for those serials and digests.
hex = { workspace = true }
# Reads and writes the DER X.509 certificates and PKCS#10 certification requests this
# service accepts (ImportCertificateAuthorityCertificate, IssueCertificate) and hands
# out (GetCertificateAuthorityCsr, GetCertificate).
x509-cert = "0.2"
# Mints the key pair a private CA signs with (CreateCertificateAuthority) and makes the
# signatures its certification request, its issued certificates and its CRLs carry. Already
# linked into this emulator by `emulator-server`, which uses it for its own TLS provider.
aws-lc-rs = "1.19"
# Enforces the PEM shape the certificate members of this service's requests are published
# with, as the regular expression the refusal quotes.
regex = "1.13"
# Amazon S3 client the bucket an enabled `CrlConfiguration` names is resolved through
# before a CA is created or updated with it: Amazon Web Services Private CA writes its
# CRLs to that bucket, and S3 is called over the in-process callback into this same
# emulator (no network client feature is enabled: the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The CloudWatch metric store a CA publishes its issuance series into
# (`state::issuance_metrics`): the datapoints go into the store `PutMetricData` writes and
# `ListMetrics` / `GetMetricStatistics` read, which is reached through the shared engine and
# needs the owning service's state TYPE.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }

[dev-dependencies]
# Generates the real certificates and certification requests the tests feed the
# service, independently of the DER this crate writes itself.
rcgen = "0.13"
# The CRL-bucket suite mounts the S3 service beside this one on a single engine, because
# CreateCertificateAuthority resolves a CRL configuration's bucket by calling S3 in
# process.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
