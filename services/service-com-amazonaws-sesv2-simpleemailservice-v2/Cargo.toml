[package]
name = "service-com-amazonaws-sesv2-simpleemailservice-v2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for Amazon SNS, driven over the in-process callback
# (`OperationContext::callback`): an event destination that publishes to an SNS topic is
# established only where that topic's own access policy does not refuse this service's
# publish, which is read from the topic itself (`state::event_publication`). Only the
# generated client is needed — the emulator supplies the transport, so the SDK's own HTTPS
# stack and runtime are left out.
aws-sdk-sns = { version = "1", default-features = false }
# The AWS SDK for Amazon Kinesis Data Firehose, driven over the same in-process callback:
# an event destination that names a Firehose stream receives each matching email event as
# a record put on that stream (`state::event_publication::firehose`). Only the generated
# client is needed — the emulator supplies the transport.
aws-sdk-firehose = { version = "1", default-features = false }
# The CloudWatch store a configuration set's CloudWatch event destination counts an email
# event in (the `AWS/SES` namespace, `state::event_publication::cloudwatch`). CloudWatch
# refuses a `PutMetricData` into a reserved `AWS/` namespace, so a service's own metrics
# never travel over that API; this writes the very store
# `ListMetrics`/`GetMetricStatistics` read.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# `mailparse`: the ONE reading of an RFC 5322 / MIME message's header block — the
# headers a message sent as `Content.Raw` carried, which a published email event reports
# (`state::event_publication::notification`). The same crate the classic SES surface reads
# a raw message with.
mailparse = "0.16"
# `csv`: the ONE writer of the comma-separated form of an export job's file
# (`state::export_file`), so the quoting of a cell that needs it is the codec's rule and
# not re-derived here. The same crate the other emulated services that publish a CSV
# artifact write theirs with.
csv = "1.3"

[build-dependencies]
emulator-core-build-support = { workspace = true }

# The scaffold's dev-dependency block, as generated for every service crate.
[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# SNS is mounted beside this service on one engine in the event-destination
# authorization suite, because the topic an event destination names is created and given
# its access policy through the SNS API the handler reads it through.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# IAM is mounted beside this service on one engine in the Firehose event-destination role
# suite, because the role an event destination names is created and given its trust policy
# through the IAM API the handler reads it through.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The AWS SDK for IAM, used by that suite's setup to create those roles over the same
# in-process hop the handler asks IAM about them through.
aws-sdk-iam = { version = "1", default-features = false }
# `percent-encoding`: the ONE encoder of a query-string component in this crate's suites —
# a page cursor a listing refuses is sent on the query string exactly as a client sends it,
# including its `+`, `/`, `=` and `!`.
percent-encoding = "2.3"

[lints]
workspace = true
