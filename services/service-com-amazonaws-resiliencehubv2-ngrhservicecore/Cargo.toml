[package]
name = "service-com-amazonaws-resiliencehubv2-ngrhservicecore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `validation_message`: the bracketed constraint report this service states for a value
# outside a member's `@pattern`, shared with the V1 endpoint of the same service.
service-common = { path = "../common" }
# The account's IAM records, read through the IAM service's own state struct in the SAME
# shared engine: `permissionModel.invokerRoleName` names a role this service has to be able
# to assume, so `CreateService` and `UpdateService` resolve it before they write.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256 for the UUID-shaped resource id of a minted service ARN.
sha2 = { workspace = true }
# Hex for that id's canonical rendering and for the opaque `ListServices` page token.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
