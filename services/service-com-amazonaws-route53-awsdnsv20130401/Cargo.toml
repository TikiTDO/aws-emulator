[package]
name = "service-com-amazonaws-route53-awsdnsv20130401"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# The checker clock (`state::health_check_status::drive_health_check_metrics`) waits for the
# instant a health check's next probe becomes due, so this crate needs tokio's timer as well
# as its runtime and macros: the feature is declared here rather than relied on from another
# crate's resolution.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `state::new_request_id`'s mixing function: a maintained digest, so the request
# id the error envelope carries is mixed by a reviewed implementation rather than
# a hand-written one. `state::signing_key` computes a delegation signer digest
# (SHA-256) with the same one.
sha2 = { workspace = true }
# `state::signing_key` presents that digest as the upper-case hexadecimal a DS
# record carries, through the maintained codec rather than a hand-written one.
hex = { workspace = true }
# `state::signing_key` reads the X.509 `SubjectPublicKeyInfo` a KMS key's public
# half is encoded as, to take the elliptic-curve point a DNSKEY record publishes,
# with the maintained decoder rather than by slicing the DER here.
spki = "0.7"
# The request-schema check (`service::xml_schema`) reads the request body with a
# maintained XML reader rather than looking at the text, and takes the position a
# schema violation names from that reader's own progress through the body.
quick-xml = "0.41"
# `service-common` carries the readers `service::tag_resource_id` needs rather than a
# private copy of each: the PATH of a request target an SDK may send absolutely, the
# segment a modelled `@httpLabel` sits at and its percent decoding, and the spelling
# the framework's constraint walk reports a list ELEMENT at
# (`service_common::validation::list_of_element`).
service-common = { path = "../common" }
# A health check's aggregate assessment is published as CloudWatch metric data in the
# `AWS/Route53` namespace, which lives in the CloudWatch emulator's own metric store: it is
# reached through the shared engine and needs the owning service's state TYPE.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# Which VPCs the account holds is a fact of its Amazon EC2 inventory — the one `DescribeVpcs`
# answers from — so the VPC a Route 53 request names is resolved against that store through
# the shared engine, which needs the owning service's state TYPE.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# A key-signing key publishes the PUBLIC half of the customer managed key it names, which
# lives in the KMS emulator's own key store: it is reached through the shared engine and
# needs the owning service's state TYPE.
service-com-amazonaws-kms-trentservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
