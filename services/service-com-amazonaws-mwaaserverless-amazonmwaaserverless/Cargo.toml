[package]
name = "service-com-amazonaws-mwaaserverless-amazonmwaaserverless"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256, used to derive the service-generated workflow/version/run identifiers.
sha2 = { workspace = true }
# Hex encoding for those identifiers and for the opaque pagination cursors.
hex = { workspace = true }
# The Amazon S3 client CreateWorkflow and UpdateWorkflow snapshot the workflow definition
# file through, over the in-process callback into this same emulator (no network client
# feature is enabled: the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# YAML reader for the snapshotted workflow definition, whose DAG-level schedule key is
# what `ScheduleConfiguration` reports. yaml-rust2 is the pure-Rust YAML 1.2
# implementation the other services that read caller-supplied YAML use; YAML 1.2 is a
# superset of JSON, so one reader covers both spellings of a definition.
yaml-rust2 = { version = "0.10", default-features = false }
# The CloudWatch Logs store a run's execution output is exported to (`state::run_logs`):
# a workflow's `LoggingConfiguration` names the log group its runs' logs are stored in, so
# the group, its streams and their events have to exist in the very store CloudWatch Logs'
# own `DescribeLogStreams` / `GetLogEvents` read.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# `cloudwatch_logs` — the tree's one reading of what a caller-supplied CloudWatch Logs log
# group NAME may be, which is what `LoggingConfiguration.LogGroupName` has to satisfy to
# name a group this service can export a run's output to.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The mwaa-serverless tests mount the Amazon S3 service beside this one on a single
# engine, because CreateWorkflow and UpdateWorkflow snapshot the workflow definition file
# by calling it.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# IAM is mounted beside them too, because UpdateWorkflow resolves the execution role its
# configuration names against this account's IAM records: a role exists in those tests
# only because IAM's own CreateRole answered for it.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# RFC 3986 percent-encoding, for the `application/x-www-form-urlencoded` body of the
# awsQuery calls those tests create a role with (a trust policy document carries the
# characters that have to be escaped).
percent-encoding = "2.3"

[lints]
workspace = true
