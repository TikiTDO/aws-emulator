[package]
name = "aws-emulator-server"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
http = "1"
http-body = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
aws-smithy-runtime-api = { version = "1.11.3", features = ["client", "http-1x"] }
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
http-body-util = "0.1.3"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tokio-rustls = "0.26"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
aws-sigv4 = { version = "1", features = ["http1"] }
aws-credential-types = "1"
aws-lc-rs = "1"
aws-smithy-checksums = "0.65.1"
percent-encoding = "2"
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
yasna = "0.5"
emulator-paths = { path = "../emulator-paths", package = "aws-emulator-emulator-paths", version = "*" }
emulator-telemetry = { path = "../emulator-telemetry", package = "aws-emulator-emulator-telemetry", version = "*" }
aws-smithy-schema-server = { path = "../smithy-schema-server", package = "aws-emulator-smithy-schema-server", version = "*" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[dev-dependencies]
assert2 = "0.4.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["test-util"] }
